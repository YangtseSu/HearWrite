# Release — tag-triggered signed build + GitHub Release (APK + R8 mapping).
# Signing material comes from repository Secrets (KEYSTORE_BASE64,
# KEYSTORE_STORE_PASSWORD, KEYSTORE_KEY_PASSWORD); keyAlias is not secret.
# workflow_dispatch runs the identical build as a smoke test but creates no
# Release, so the signing path can be verified without publishing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    permissions:
      contents: write # softprops/action-gh-release
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the notes step resolves the previous tag for the compare link.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Accepts SDK licenses; AGP auto-downloads platforms;android-37 + build-tools.
      - uses: android-actions/setup-android@v4

      # Without this guard a missing secret silently yields an *unsigned* APK
      # (app/build.gradle.kts degrades by design) — here it must be a hard error.
      - name: Require signing secrets
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::KEYSTORE_BASE64 / *PASSWORD secrets missing — refusing to build unsigned."
          exit 1

      # DEVELOPMENT.md §4.5: tag must match versionName; bump before tagging.
      - name: Guard tag against versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [ "v${VER}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != versionName ${VER} — bump app/build.gradle.kts first."
            exit 1
          fi

      # Reproduces the gitignored local pair; both files die with the runner.
      - name: Restore keystore and signing properties
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > hearwrite-release.jks
          {
            echo "storeFile=hearwrite-release.jks"
            echo "storePassword=${KEYSTORE_STORE_PASSWORD}"
            echo "keyAlias=hearwrite"
            echo "keyPassword=${KEYSTORE_KEY_PASSWORD}"
          } > keystore.properties

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      # Proof the artifact carries the release certificate, not a silent no-op.
      - name: Verify signature
        run: |
          APKSIGNER="$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | tail -1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Build release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # The repo ships direct-to-main (no PRs), so GitHub's auto-generated
          # notes would be an empty compare link — the body comes from the
          # matching CHANGELOG.md section instead. Missing section = hard fail.
          VER="${GITHUB_REF_NAME#v}"
          NOTES="$(awk -v ver="$VER" '
            $0 == "## [" ver "]" || $0 ~ "^## \\[" ver "\\]" { in_sec = 1; next }
            in_sec && /^## \[/ { exit }
            in_sec { print }
          ' CHANGELOG.md)"
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for [$VER] — add it before tagging."
            exit 1
          fi
          {
            echo "$NOTES"
            echo ""
            PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            if [ -n "$PREV" ]; then
              echo "**完整提交记录**：https://github.com/${{ github.repository }}/compare/${PREV}...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          body_path: release-notes.md
          # 0.x.y is pre-release until the first stable bump (AGENTS.md versioning).
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
