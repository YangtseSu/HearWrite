# CI — assemble + unit tests + lint on every pull request, plus instrumentation
# tests on a cloud emulator (androidTest infra lives in app/src/androidTest and
# must run on device — GitHub-hosted emulator). Public-repo reproducibility
# gate: a fresh checkout must build.
#
# `push` is narrowed to main on purpose: a bare `push:` also runs CI on every
# branch a pull request comes from, so each PR push produced two identical runs
# of both jobs (two emulators per commit). Pull requests are covered by the
# `pull_request` event — including from forks — and direct pushes to main by the
# `push` event. Tag pushes are deliberately not covered: the Release workflow
# builds and signature-verifies that exact commit on the tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build, unit tests & lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle (wrapper + dependency cache)
        uses: gradle/actions/setup-gradle@v6

      # Accepts Android SDK licenses; AGP then auto-downloads platforms;android-37.2.
      #
      # `packages: platform-tools` is required, not cosmetic: the action's default
      # is `tools platform-tools`, but Google retired the standalone `tools`
      # package (it is folded into `cmdline-tools`), so `sdkmanager tools` now
      # exits 1 with "Failed to find package 'tools'" and fails the job before a
      # single line of repo code runs. platform-tools still needs installing, so
      # the default is narrowed rather than emptied.
      #
      # `cmdline-tools-version` overrides the action's default (20.0, build
      # 14742923) with the current 23.0. The build step itself needs nothing
      # from it — AGP auto-downloads the platform — but the SDK on disk should
      # match the machine setup documented in DEVELOPMENT.md §1.3.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          cmdline-tools-version: 16111833

      # The bundled word lists ship verbatim into the APK; a broken row would
      # reach every user at once. Depends on nothing but python3 — run it
      # before the (slow) Gradle step so a data error fails fast.
      # Contract: docs/WORDLIST.md
      - name: Validate bundled word lists
        run: python3 scripts/check-assets.py

      - name: Build debug APK, run unit tests and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

  # Room migrations and DAO behavior are verified by instrumentation tests
  # (app/src/androidTest) — they need a real Android runtime, so they run on
  # a GitHub-hosted emulator. Previously they only ever ran locally.
  #
  # API 36, not 37. Two API 37 images were tried and neither booted here:
  # `android-37.1;google_apis_ps16k` (16 KB pages) and `android-37.0;
  # google_apis` (plain), both stable-channel. In each run the emulator
  # printed its userspace boot properties and then produced no further
  # output until the action's 600 s boot timeout killed it. The 37.0 attempt
  # rules out page size — it is the same plain `google_apis` type as the 36
  # image this job runs, which boots in ~41 s. Both API 37 images also boot
  # fine locally (the 37.1 one in ~33 s, with the identical emulator version
  # and flags), so this is an API 37-image/runner incompatibility, not a
  # workflow misconfiguration. See docs/ROADMAP.md.
  #
  # 37.2 has no stable image at all (its stable-channel entries are `-betaN`
  # builds; the plain 37.2 image is dev-channel). The app's own compileSdk
  # 37.2 is unaffected either way — AGP auto-downloads that platform in the
  # gradle step, independently of which image the emulator runs.
  #
  # No `strategy.matrix` here, deliberately: the branch protection rule
  # required-status context is "Instrumented tests (emulator)", and a matrix
  # makes GitHub report the check as "<job name> (<matrix values>)" — which no
  # required context can match, leaving main unmergeable for anyone without
  # admin bypass. One API level means the matrix buys nothing; if a second one
  # is ever added, keep the context stable with an aggregate job rather than
  # re-adding a matrix.
  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle (wrapper + dependency cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The app's minSdk floor (see the job comment): the oldest SQLite the
          # app can meet, hence the strictest migration test. Quoted history:
          # the action stringifies this value, and an unquoted YAML number would
          # lose a trailing `.0` (String(37.0) is "37", which turns into the
          # non-existent `platforms;android-37`); kept so a future
          # minor-versioned API level does not silently break the SDK install.
          api-level: "33"
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
