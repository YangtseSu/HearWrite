# CI — assemble + unit tests on every push / pull request.
# Public-repo reproducibility gate: a fresh checkout must build.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (wrapper + dependency cache)
        uses: gradle/actions/setup-gradle@v6

      # Accepts Android SDK licenses; AGP then auto-downloads platforms;android-37.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
