# CI — assemble + unit tests + lint on every push / pull request, plus
# instrumentation tests on a cloud emulator (androidTest infra lives in
# app/src/androidTest and must run on device — GitHub-hosted emulator).
# Public-repo reproducibility gate: a fresh checkout must build.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build, unit tests & lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle (wrapper + dependency cache)
        uses: gradle/actions/setup-gradle@v6

      # Accepts Android SDK licenses; AGP then auto-downloads platforms;android-37.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK, run unit tests and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

  # Room migrations and DAO behavior are verified by instrumentation tests
  # (app/src/androidTest) — they need a real Android runtime, so they run on
  # a GitHub-hosted emulator. Previously they only ever ran locally.
  #
  # API 36, not 37: GitHub runner images ship android-37 as `android-37.0`
  # and sdkmanager cannot fetch `platforms;android-37` (actions/runner-images
  # #13859), which makes android-emulator-runner's SDK-install step fail.
  # AGP resolves compileSdk 37 (auto-download) in the gradle step; the
  # emulator itself only runs the app's instrumentation tests (minSdk 33),
  # so API 36 exercises the same code path.
  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [36]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle (wrapper + dependency cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
