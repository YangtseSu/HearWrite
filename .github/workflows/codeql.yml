# CodeQL static analysis — currently PAUSED.
#
# The repo tracks latest-stable Kotlin (no-pin policy, AGENTS.md). CodeQL's
# Kotlin extractor rejects the current Kotlin 2.4.20 with
#   KotlinVersionTooRecentError: CodeQL currently supports versions below 2.4.20
#
# Verified 2026-09-16 against both bundles available that day:
#   - codeql-bundle-v2.27.0 (the latest *stable*, 2026-09-09): Autobuild fails
#     with the error above — the support PR (github/codeql#22404, "Kotlin:
#     support 2.4.20") merged 2026-09-08 and missed the 2.27.0 release cut.
#   - codeql-bundle-20260915 (nightly, CLI 2.27.1+20260914): Autobuild compiles
#     the Kotlin sources and the analysis completes with no KotlinVersionTooRecent
#     error. Upstream says 2.27.1 ships the fix, ~2026-09-24.
# The same workflow body was used for both runs (only `tools:` differed), so the
# Kotlin version alone decides it.
#
# Honoring latest-stable Kotlin takes precedence over CodeQL coverage, so this
# workflow stays off until a *stable* bundle carries #22404. Re-enable = restore
# `on:` (push to main, pull_request, weekly schedule) and delete the `if: false`
# guard; the rest of this file is already the exact shape the re-enable needs,
# and was rehearsed green on 2026-09-16 (real push trigger, no guard, @v4
# actions, nightly bundle standing in for stable 2.27.1):
#   - `packages: platform-tools` on the SDK step — the standalone `tools`
#     package no longer exists and would otherwise fail the job before any
#     repo code ran, looking like a CodeQL problem (same fix as build.yml /
#     release.yml).
#   - `@v4` on the three codeql-action steps — v3 is deprecated in December
#     2026. Renovate watches these pins too (github-actions manager, added to
#     enabledManagers in renovate.json); digest pinning is deliberately off —
#     the repo tracks latest stable, not immutable SHAs.
# Tracked in: https://github.com/YangtseSu/HearWrite/issues/7
#
# Secret scanning + push protection are enabled repo-wide (independent of
# CodeQL) and cover the credential-leak class that matters most here.
name: "CodeQL"

on:
  workflow_dispatch: # manual run only; scheduled/push runs disabled below

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    if: false # paused — see header comment
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["java-kotlin"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
      # `packages: platform-tools` is required, not cosmetic: the action's
      # default is `tools platform-tools`, but Google retired the standalone
      # `tools` package (folded into `cmdline-tools`), so `sdkmanager tools`
      # exits 1 with "Failed to find package 'tools'" and fails the job before
      # any repo code runs. Same narrowing as build.yml / release.yml.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
