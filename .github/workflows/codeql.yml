# CodeQL static analysis — currently PAUSED.
#
# The repo tracks latest-stable Kotlin (no-pin policy, AGENTS.md). CodeQL's
# Kotlin extractor rejects Kotlin 2.4.20 with
#   KotlinVersionTooRecentError: CodeQL currently supports versions below 2.4.20
# (verified against the latest codeql-action bundle v2.27.0, 2026-09-10).
# Honoring latest-stable Kotlin takes precedence over CodeQL coverage, so
# this workflow is disabled until the extractor supports the current Kotlin.
# Re-enable by restoring `on:` and deleting the `if: false` guard.
# Tracked in: https://github.com/YangtseSu/HearWrite/issues/7
#
# Secret scanning + push protection are enabled repo-wide (independent of
# CodeQL) and cover the credential-leak class that matters most here.
name: "CodeQL"

on:
  workflow_dispatch: # manual run only; scheduled/push runs disabled below

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    if: false # paused — see header comment
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["java-kotlin"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
