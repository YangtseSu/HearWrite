distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Official Gradle distribution, SHA-256 anchored from gradle.org. If
# services.gradle.org is unreachable (common on mainland-China networks),
# swap in the Tencent mirror — identical artifact, same checksum:
#   distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.7.1-bin.zip
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
networkTimeout=60000
retries=3
retryBackOffMs=1000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
