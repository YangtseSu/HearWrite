# REUSE licensing metadata (https://reuse.software) for the files that cannot
# speak for themselves.
#
# The RECOMMENDED method — an `SPDX-FileCopyrightText` / `SPDX-License-Identifier`
# header in the file — is used throughout: every hand-edited text file carries
# one, and it always wins (the default `closest` precedence is applied to
# copyright and license separately, so a table below only fills in what a file
# cannot say). This file therefore holds three things:
#
#  1. The project-wide fallback: every tracked file is `GPL-3.0-or-later` unless
#     it says otherwise. It covers the bundled data assets, the Room-exported
#     schema and other generated files that cannot carry a comment header at all
#     (see docs/WORDLIST.md §5–§6 for how they are generated and where every
#     source comes from: alice, ECDICT, ipa-dict, 《现代汉语常用词表（草案）》,
#     the 课标字表 and the textbook extracts).
#     It also keeps the gate honest for files the tool happens to misread: the
#     REUSE tool detects a file's encoding from its first 2048 bytes, and when
#     that cut splits a UTF-8 character (routine in this CJK-heavy tree, e.g.
#     README.md) the file is mistaken for binary and its header is not seen.
#     Without a fallback those files would be reported as untagged.
#  2. The Gradle wrapper, which is Gradle's own Apache-2.0 artifact.
#  3. The vendored Edge client (LGPLv3, synced from github.com/YangtseSu/
#     edge-tts-kotlin) — pinned here so that its license never depends on how
#     the tool reads the file.
#
# The canonical GPL text is the root `LICENSE` (kept there by convention);
# `LICENSES/GPL-3.0-or-later.txt` links to it.

version = 1

SPDX-PackageName = "HearWrite"
SPDX-PackageDownloadLocation = "https://github.com/YangtseSu/HearWrite"

[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Yangtse Su"
SPDX-License-Identifier = "GPL-3.0-or-later"

# `gradlew` / `gradlew.bat` ship Gradle's own SPDX tags; the wrapper jar and
# `.properties` are generated by the `wrapper` task and carry none of their own.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2015 the original authors"
SPDX-License-Identifier = "Apache-2.0"

# The GPL text rendered by the in-app 开源许可 page (SettingsAboutPage.kt) — a
# verbatim copy of the root `LICENSE`, so the copyright is the FSF's.
[[annotations]]
path = ["app/src/main/assets/licenses/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc. <https://fsf.org/>"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["app/src/main/java/io/edge/**"]
precedence = "override"
SPDX-FileCopyrightText = "2025 rany <rany@riseup.net> and contributors"
SPDX-License-Identifier = "LGPL-3.0-or-later"
